marion-kieffer:
  id: marion-kieffer
  name: Marion Kieffer
  type: person
  avatar: ""            # à remettre à /images/authors/marion-kieffer.webp le jour où le fichier existe
  photos: []            # idem pour les visuels du bloc auteur
  jobTitle:
    fr: Pâtissière amateur
    en: Home baker
  role:
    fr: Pâtissière amateur
    en: Home baker
  bio:
    fr: "Marion Kieffer fait le goûter maison depuis une dizaine d'années, d'abord pour ses enfants puis par goût. Elle pâtisse dans une cuisine ordinaire, avec un four qui chauffe mal, et écrit surtout sur ce qui rate et pourquoi."
    en: "Marion Kieffer has been baking afternoon treats at home for about ten years, first for her children and then for the pleasure of it. She bakes in an ordinary kitchen with an oven that heats unevenly, and writes mostly about what goes wrong and why."
  quote:
    fr: "La plupart des recettes ne disent pas l'essentiel : la vraie température, le temps de repos, et le matériel qu'elles supposent."
    en: "Most recipes leave out what matters: the real temperature, the resting time, and the equipment they quietly assume you own."
  expertise:
